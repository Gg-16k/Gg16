<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trust Market Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="admin-wrap"><a href="/">← Trust Market</a><h1>Trust Market Admin</h1><p class="muted">Private moderation area. Do not share your admin token.</p><section class="admin-card"><label>Admin token<input id="token" type="password" autocomplete="off" placeholder="Paste ADMIN_TOKEN"></label><button class="btn btn-primary" id="load">Open dashboard</button><span id="status"></span></section><div id="dashboard" class="admin-grid" hidden><section class="admin-card"><h2>Listings</h2><div id="listings"></div></section><section class="admin-card"><h2>Orders</h2><div id="orders"></div></section><section class="admin-card"><h2>Reviews</h2><div id="reviews"></div></section></div></main><script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let token='';
async function api(path,opts={}){opts.headers={...(opts.headers||{}),authorization:'Bearer '+token,'content-type':'application/json'};const r=await fetch(path,opts);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function actions(type,id){return `<div class="admin-actions"><button class="btn btn-light" onclick="change('${type}',${id},'approved')">Approve</button><button class="btn btn-light" onclick="change('${type}',${id},'rejected')">Reject</button></div>`}
function render(d){$('#dashboard').hidden=false;$('#listings').innerHTML=d.listings.map(x=>`<article class="listing-card"><b>${esc(x.title)}</b><div class="listing-meta"><span>${esc(x.category)}</span><span>${esc(x.role)}</span><span>${esc(x.location)}</span><span>${esc(x.status)}</span></div><p>${esc(x.description)}</p><small>Private owner: ${esc(x.owner_name)} • ${esc(x.owner_phone)}</small>${x.status==='pending'?actions('listing',x.id):''}</article>`).join('')||'<p>No listings.</p>';$('#orders').innerHTML=d.orders.map(x=>`<article class="listing-card"><b>${esc(x.public_ref)}</b><div class="listing-meta"><span>${esc(x.payment_method)}</span><span>${esc(x.amount)} ETB</span><span>${esc(x.status)}</span></div><p>${esc(x.customer_name)} • ${esc(x.customer_phone)}</p><small>${esc(x.payment_reference||'No reference')}</small>${x.receipt_data?`<details><summary>Private receipt</summary><img src="${esc(x.receipt_data)}" alt="Private payment receipt" style="max-width:100%;max-height:420px"></details>`:''}${x.status==='payment_review'?`<div class="admin-actions"><button class="btn btn-light" onclick="change('order',${x.id},'paid')">Mark paid</button><button class="btn btn-light" onclick="change('order',${x.id},'rejected')">Reject</button></div>`:''}</article>`).join('')||'<p>No orders.</p>';$('#reviews').innerHTML=d.reviews.map(x=>`<article class="listing-card"><b>${esc(x.name)} — ${x.rating}/5</b><p>${esc(x.body)}</p><span>${esc(x.status)}</span>${x.status==='pending'?actions('review',x.id):''}</article>`).join('')||'<p>No reviews.</p>'}
async function change(type,id,status){try{const path=type==='listing'?'/api/listings':type==='order'?'/api/orders':'/api/reviews';await api(path,{method:'PATCH',body:JSON.stringify({id,status})});await load()}catch(e){alert(e.message)}}
async function load(){try{$('#status').textContent=' Loading…';const d=await api('/api/admin');render(d);$('#status').textContent=' Ready';$('#status').className='admin-ok'}catch(e){$('#status').textContent=' '+e.message;$('#status').className='admin-error'}}
$('#load').onclick=()=>{token=$('#token').value.trim();if(token)load()};
</script></body></html>
